name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-live-and-simulator:
    name: Authenticated E2E Suite & Booted iOS Simulator
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Authenticated E2E Suite
        env:
          ALHATORAH_TEST_EMAIL: ${{ secrets.ALHATORAH_TEST_EMAIL }}
          ALHATORAH_TEST_PASSWORD: ${{ secrets.ALHATORAH_TEST_PASSWORD }}
        run: |
          node scripts/e2e_full_suite.js

      - name: Select Xcode 26
        run: |
          set -euo pipefail

          echo "Available Xcode apps:"
          ls -1 /Applications | grep '^Xcode' || true

          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)"
          fi

          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Run Core Unit Tests
        run: |
          set -euo pipefail
          mkdir -p build_logs
          swiftc -parse-as-library \
            NativeSiteAppTests/RunCoreTests.swift \
            NativeSiteApp/Core/AlHaTorahModels.swift \
            NativeSiteApp/Core/AlHaTorahLocation.swift \
            NativeSiteApp/Core/AlHaTorahDashboardParser.swift \
            NativeSiteApp/Utilities/AppLocalization.swift \
            -o build_logs/core_tests_mac
          ./build_logs/core_tests_mac

      - name: Live Booted iOS Simulator App Execution
        run: |
          set -euo pipefail
          mkdir -p build_logs

          echo "Finding an available iPhone simulator..."
          SIM_DEVICE_LINE=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 || true)
          if [ -z "$SIM_DEVICE_LINE" ]; then
            echo "Creating a new iPhone simulator device..."
            RUNTIME_ID=$(xcrun simctl list runtimes | grep -i "iOS" | awk '{print $NF}' | head -n 1)
            SIM_ID=$(xcrun simctl create "Test-iPhone" "iPhone 16" "$RUNTIME_ID")
          else
            SIM_ID=$(echo "$SIM_DEVICE_LINE" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          fi
          echo "Selected Simulator UDID: $SIM_ID"

          echo "Booting Simulator $SIM_ID..."
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b

          echo "Building NativeSiteApp for iOS Simulator..."
          xcodebuild -project NativeSiteApp.xcodeproj \
            -scheme NativeSiteApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build -derivedDataPath build/derivedDataSim \
            2>&1 | tee build_logs/simulator_build.log

          APP_BUNDLE=$(find build/derivedDataSim -name "NativeSiteApp.app" -type d | head -n 1)
          if [ -z "$APP_BUNDLE" ]; then
            echo "ERROR: NativeSiteApp.app not found in build/derivedDataSim"
            exit 1
          fi
          echo "Found Simulator App Bundle: $APP_BUNDLE"

          echo "Installing App onto Booted Simulator..."
          xcrun simctl install "$SIM_ID" "$APP_BUNDLE"

          echo "Launching App in Booted Simulator..."
          xcrun simctl launch "$SIM_ID" com.davidpovarsky.alhatorah

          echo "Waiting 5 seconds for native app startup..."
          sleep 5

          echo "Verifying running process in simulator..."
          xcrun simctl spawn "$SIM_ID" launchctl list | grep "com.davidpovarsky.alhatorah" || true

          echo "Capturing simulator screenshot..."
          xcrun simctl io "$SIM_ID" screenshot build_logs/simulator_launch.png

          echo "Testing cold relaunch: terminating app..."
          xcrun simctl terminate "$SIM_ID" com.davidpovarsky.alhatorah

          echo "Relaunching app from cold state..."
          xcrun simctl launch "$SIM_ID" com.davidpovarsky.alhatorah
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot build_logs/simulator_relaunch.png
          xcrun simctl terminate "$SIM_ID" com.davidpovarsky.alhatorah

          echo "Simulator test run completed successfully!"

      - name: Upload Test and Simulator Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-and-simulator-results
          path: build_logs/

  build-ipa:
    name: Build unsigned iPhoneOS IPA
    needs: e2e-live-and-simulator
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail

          echo "Available Xcode apps:"
          ls -1 /Applications | grep '^Xcode' || true

          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort | tail -n 1)"
          fi

          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

          xcodebuild -version

          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK version: $SDK_VERSION"

          case "$SDK_VERSION" in
            26*) echo "Confirmed iOS 26 SDK." ;;
            *) echo "Confirmed iOS SDK $SDK_VERSION" ;;
          esac

      - name: Build IPA
        env:
          BUNDLE_ID: com.davidpovarsky.alhatorah
          CONFIGURATION: Release
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NativeSiteApp-ipa-and-logs
          path: |
            build/ipa/*.ipa
            build_logs/*.log
            build_logs/last_build_summary.txt
          if-no-files-found: warn